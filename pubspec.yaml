name: hele_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.0
environment:
  sdk: '>=3.4.0 <4.0.0'

# 生产环境依赖
dependencies:
  flutter:
    sdk: flutter

  # 国际化
  flutter_localizations: # 国际化
    sdk: flutter
  intl: any # 国际化

  # 界面UI
  custom_sliding_segmented_control: any # 分段器
  scroll_datetime_picker: any # 滑动时间选择
  loading_animation_widget: any # 加载动画
  animated_rating_stars: any # 评分星标
  flutter_smart_dialog: any # 弹窗
  font_awesome_flutter: any # icon
  auto_size_text: any # 文本自适应
  expand_widget: any # 文本折叠
  cupertino_icons: any # icon
  fl_chart: any # 图表
  gap: any # 间隔

  # 网络请求
  connectivity_plus: any
  dio: any # 网络请求

  # 开发工具
  cached_network_image: any # 图片缓存
  flutter_screenutil: any # 屏幕适配
  url_launcher: any # url跳转
  easy_debounce: any # 防抖
  share_plus: any # 分享
  nil: any # 占位符

  # 状态管理
  get: any # 路由 & 状态管理
  provider: any # 状态管理

  # 本地存储
  shared_preferences: any # 本地状态存储
  floor: any # 本地数据库

# 开发环境依赖
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

  flutter_launcher_icons: any # 应用图标生成
  # 本地数据库
  floor_generator: any
  build_runner: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon/
    - assets/images/png/

# 应用图标生成
flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  ios: true
  image_path: "assets/images/icon/hele.png"

# 国际化配置
flutter_intl:
  generate: true
  #  enabled: true
  # 自定义生成配置
  arb-dir: lib/l10n
  format: true
  output-class: S
  output-dir: lib/l10n/gen
  output-localization-file: app_g.dart
  template-arb-file: app_en.arb
  synthetic-package: false
  nullable-getter: false
  untranslated-messages-file: lib/l10n/gen/app_g_untranslated.json
